#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Also run the live Oracle stages (needs the ORA19C_* secrets)'
        type: boolean
        default: false

# Superseding a push is the point: a newer commit makes the older run's answer
# uninteresting. A manual run is different — it is the release matrix, it takes
# most of an hour, and it is started deliberately. Giving each dispatch its own
# group by run id means an unrelated docs push cannot kill it, which is exactly
# what happened twice before this line existed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

# What runs when, and why.
#
# Every push and pull request gets the cheap Linux lanes: the protocol suite,
# the adapter suite with the clean-machine gate, and tidy. Those are what
# actually find things — of the defects this pipeline has caught, all but one
# came from a Linux lane, and none from macOS.
#
# The full distribution matrix runs only on a tag or by hand. It used to be a
# question of money — on a private repository Actions bill with multipliers,
# macOS at 10x, and one matrix run cost roughly 900 of a 2,000-minute monthly
# allowance. This repository is public now, so that reason is gone and the
# minutes are free.
#
# It stays gated on time instead: the matrix is most of an hour, and between
# releases it repeats what the cheap lanes already answered. What it uniquely
# covers is Windows and macOS compilation, which is why a release must not skip
# it — and why `scripts/check_windows_view.py` runs on every push, to catch the
# Windows-only mistakes without waiting forty minutes to hear about them.
jobs:
  duckdb-stable-build:
    name: Build extension binaries
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      # DuckDB v2.0.0, pinned to exactly what Community Extensions builds a
      # descriptor's `ref` against (its build.yml): the version stamped into
      # the artifact, the commit that tag names, and the ci-tools track. A
      # release is only proven if this matrix ran on the same three, and they
      # move together.
      duckdb_version: v2.0.0
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: oracle_scanner
      # A WebAssembly build cannot open a TCP socket, so it cannot connect to
      # Oracle at all — docs/CAPABILITIES.md says so, and the extension refuses
      # by name at connect. Shipping an artifact that always refuses is worse
      # than not shipping one. It is also the only target that does not build:
      # wasm_threads fails to link because the vcpkg OpenSSL for
      # wasm32-emscripten is not compiled with the atomics/bulk-memory features
      # that --shared-memory needs. Our own sources compile for wasm fine.
      #
      # windows_amd64_mingw goes too. The MSVC target, windows_amd64, is the
      # Windows build that matters and it passes; mingw is a second toolchain
      # whose only failures here have been its own strictness, with no user on
      # the other side of them. 132 of the 319 published community extensions
      # exclude it, so this is the ordinary choice rather than a retreat.
      # 只构建本项目真正需要的平台：windows_amd64（MSVC）。
      #
      # 这个仓库的产物是给 data-manager 平台的 DuckDB 联邦引擎用的，
      # 那台机器是 Windows x64。别的平台（linux/osx/arm）没有人下载，
      # 却各要占一次矩阵构建的分钟数和时间。
      #
      # **为什么用 exclude 而不是 opt_in**：
      # ci-tools 的 `opt_in_archs` 不是白名单，而是「把 matrix.json 里
      # 标了 opt_in 的 arch 额外放进来」——默认集（opt_in=false）照样全跑。
      # 查 scripts/extbuild/internal/distmatrix/matrix.go 的 includeEntry：
      #     if entry.OptIn { return arch 在 optInSet 里 }
      #     if reducedCI && !entry.RunInReducedCIMode { return false }
      #     return true
      # 所以要真的只留一个平台，只能把其余全列进 exclude。
      #
      # 排除清单覆盖 ci-tools config/distribution_matrix.json 的全部 arch。
      # 要恢复全平台构建，把这一行删掉即可。
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_arm64;linux_amd64;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64'

  # clang-tidy over this project's own sources. Not the reusable code-quality
  # workflow: its tidy target filters translation units with the regex
  # `$(PROJ_DIR)src/.*/`, which requires a slash after `src/`. Every source here
  # is `src/*.cpp`, so the filter matched nothing and the job passed having
  # checked no files — green, and meaningless. scripts/tidy.sh runs the same
  # check list from duckdb/.clang-tidy against the files that actually exist,
  # needs no compile database, and does not configure DuckDB, so it takes about
  # a minute.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install clang-tidy and OpenSSL
        run: sudo apt-get update && sudo apt-get install -y clang-tidy libssl-dev pkg-config

      - name: Run clang-tidy
        run: scripts/tidy.sh

  code-quality-check:
    name: Code Quality Check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      # The same DuckDB as duckdb-stable-build above.
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: oracle_scanner
      # `tidy` only, deliberately. The format check applies duckdb/.clang-format
      # across all of src/, and this tree has two styles on purpose: protocol and
      # session code uses 4-space indentation and snake_case file names per
      # AGENTS.md, while the DuckDB adapter follows DuckDB house style because it
      # mirrors template and API code. Running the check would demand the
      # protocol half be reindented, which is the opposite of the rule it is
      # supposed to enforce. Re-enable it by adding 'format' here if that
      # split is ever dropped.
      format_checks: 'tidy'

  # The distribution pipeline runs the sqllogictest suite and nothing else, so
  # the protocol suite — parsers, codecs, session contract, and every bounds and
  # truncation case — never ran in CI at all. It needs no DuckDB, which is what
  # makes running it on every push affordable.
  protocol-tests:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install OpenSSL
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build and run
        run: scripts/build_protocol_test.sh

      # Windows compiles only in the release matrix, so a file that does not
      # build there used to cost a forty-minute run to discover — three of them,
      # one defect at a time. This resolves the platform conditionals and
      # inspects what a Windows compiler would actually see: unbalanced braces
      # from a guard that excludes an opening or closing token, POSIX headers or
      # calls that survive into that view, and enumerators named after Windows
      # macros. It takes under a second and needs no Windows.
      - name: Check the Windows view of the sources
        run: python3 scripts/check_windows_view.py

  # macOS has never been the lane that found a defect here. Every
  # platform-specific bug this suite caught was Linux-only, and macOS hid
  # several of them — SIGPIPE, a hardcoded /private/tmp, an unspecified
  # evaluation order — because it is also the platform the code is written on.
  # Running it before a release is enough; running it on every commit would
  # mostly confirm what the author's own machine already said.
  protocol-tests-macos:
    name: Protocol tests (macOS)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install OpenSSL
        run: |
          brew install openssl@3 pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build and run
        run: scripts/build_protocol_test.sh

  # One full build carries the two things that need a built artifact: the
  # adapter suite, which drives the DuckDB adapter against a fake session, and
  # the clean-machine gate. Neither touches a database or the network.
  adapter-and-clean-machine:
    name: Adapter tests and clean-machine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config ninja-build

      - name: Build
        run: GEN=ninja make release

      - name: Run the C++ suites
        run: ctest --test-dir build/release/extension/oracle_scanner --output-on-failure --timeout 600

      - name: Prove no Oracle client is linked or loaded
        run: scripts/check_no_oracle_client.sh

      - name: Check the capture inventory against PROVENANCE.md
        run: |
          scripts/capture_inventory.sh | while read -r digest name rest; do
            grep -q "$digest" PROVENANCE.md || {
              echo "capture $name has hash $digest, which PROVENANCE.md does not record" >&2
              exit 1
            }
          done

  # The live lanes need an Oracle nobody outside this repository has, so they
  # are triggered by hand rather than on every push. The stage list lives in
  # scripts/run_live_stages.sh: a lane that only exists as something somebody
  # types is a lane nobody else can reproduce.
  live-oracle:
    name: Live Oracle stages
    # Opt-in even on a manual run. The endpoints live nowhere but a maintainer's
    # own machine, so without the secrets this lane cannot pass, and having it
    # fail on every manual run of the release matrix would train people to
    # ignore a red mark.
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config ninja-build

      - name: Build
        run: GEN=ninja make release

      - name: Run the live stages
        env:
          ORACLE_SCANNER_LIVE: '1'
          ORA19C_HOST: ${{ secrets.ORA19C_HOST }}
          ORA19C_PORT: ${{ secrets.ORA19C_PORT }}
          ORA19C_SERVICE: ${{ secrets.ORA19C_SERVICE }}
          ORA19C_USER: ${{ secrets.ORA19C_USER }}
          ORA19C_PASSWORD: ${{ secrets.ORA19C_PASSWORD }}
        run: scripts/run_live_stages.sh build/release/extension/oracle_scanner/oracle_scanner_protocol_test
